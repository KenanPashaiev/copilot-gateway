# copilot-gateway configuration
# All values can be overridden by environment variables.

server:
  # Address to bind to. Use 0.0.0.0 for Docker, 127.0.0.1 for local dev.
  # Env override: HOST
  host: "0.0.0.0"

  # Port to listen on.
  # Env override: PORT
  port: 3001

  # Log level: debug, info, warning, error
  # Env override: LOG_LEVEL
  log_level: "info"

copilot:
  # Default model when not specified in the request.
  # Env override: DEFAULT_MODEL
  default_model: "gpt-4o"

  # Path to Copilot CLI binary (leave empty to use bundled/system PATH).
  # Env override: COPILOT_CLI_PATH
  cli_path: ""

models:
  # How long to cache the model list (in seconds).
  cache_ttl: 300

tools:
  # List of Python module paths to load as tools.
  # Each module should define tools using the Copilot SDK's @define_tool decorator
  # or export a TOOLS list of Tool objects.
  #
  # Built-in tools ship with the image under copilot_gateway.tools.builtins.*
  # Custom tools can be mounted into the container and referenced here.
  enabled:
    - copilot_gateway.tools.builtins.get_time
    - copilot_gateway.tools.builtins.web_search
